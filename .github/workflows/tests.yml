name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements/requirements-dev.txt
      - run: python -m pytest -q
      - run: python src/activity.py --help
  multimodal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/requirements-replay.txt
      - name: Build native runner
        run: |
          curl -fL https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-linux-x64-1.31.0.tgz -o /tmp/ort.tgz
          echo "cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57  /tmp/ort.tgz" | sha256sum -c -
          tar -xzf /tmp/ort.tgz -C /tmp
          cmake -S native -B /tmp/activity-build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT=/tmp/onnxruntime-linux-x64-1.31.0
          cmake --build /tmp/activity-build --parallel 2
      - run: python -m pytest -q
        env:
          ACTIVITY_NATIVE: /tmp/activity-build/activity_infer
          MLFLOW_DISABLE_TELEMETRY: 'true'
          DO_NOT_TRACK: 'true'
      - run: python src/multimodal.py --help
      - run: python src/attention.py --help
      - run: python src/robustness.py --help
      - run: python src/transfer.py --help
      - run: python src/inference_api.py --help
      - run: python src/export_serving.py --help
      - run: python src/replay_data.py --help
      - run: python src/replay_server.py --help
      - run: python src/track_results.py --help
  replay-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
